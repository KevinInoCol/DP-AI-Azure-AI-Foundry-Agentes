# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: agente-hosted-inmobiliaria
services:
    agent-framework-agent-inmobiliaria:
        project: src/agent-framework-agent-inmobiliaria
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            GOOGLE_SHEETS_ID: ${GOOGLE_SHEETS_ID}
            GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON}
            MEMORY_STORE_NAME: alpha_state_memory
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Asesor inmobiliario virtual de Alpha State (Microsoft Agent Framework, protocolo Responses) para clientes de Campinas. Busca alquileres en el catálogo de Google Sheets (tool buscar_propiedades_alquiler), responde políticas, pagos, requisitos y garantías desde la base de conocimiento Foundry IQ (tool consultar_politicas_alpha_state) y recuerda a cada cliente entre conversaciones con Memoria de Foundry. Para compra y venta recoge la necesidad y el contacto para un asesor humano. Nunca inventa datos.
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Streaming
                - Inmobiliaria
                - Google Sheets
                - Function Calling
                - Foundry IQ
                - RAG
                - Foundry Memory
        name: agente-hosted-inmobiliaria
        protocols:
            - protocol: responses
              version: 2.0.0
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-5.4-mini
                version: "2026-03-17"
              name: gpt-5.4-mini
              sku:
                capacity: 10
                name: DataZoneStandard
        endpoint: https://datapath-inofuente-resource.services.ai.azure.com/api/projects/datapath-inofuente
infra:
    provider: microsoft.foundry
